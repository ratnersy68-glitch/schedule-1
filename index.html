<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coil Arena</title>
<style>
  :root{
    --accent:#4be3ff;
    --accent2:#ff5fa2;
    --bg-panel: rgba(12,16,26,0.72);
    --bg-panel-border: rgba(255,255,255,0.08);
    --text-main:#eaf6ff;
    --text-dim:#8fa3b8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#05070c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    touch-action:none;
    user-select:none;
  }
  #gameCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:block;
    background:#05070c;
    cursor:crosshair;
  }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; inset:0; pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--bg-panel-border);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  #statsPanel{
    position:absolute; top:16px; left:16px;
    padding:12px 18px;
    min-width:150px;
  }
  #statsPanel .row{ display:flex; justify-content:space-between; gap:18px; font-size:13px; color:var(--text-dim); letter-spacing:0.06em; margin-bottom:4px;}
  #statsPanel .row:last-child{ margin-bottom:0; }
  #statsPanel .val{ color:var(--text-main); font-weight:700; font-size:15px; }
  #statsPanel .lbl{ font-weight:600; }
  #scoreVal{ color:var(--accent); }
  #lengthVal{ color:var(--accent2); }

  #leaderboard{
    position:absolute; top:16px; right:16px;
    padding:12px 16px 14px;
    width:190px;
  }
  #leaderboard h3{
    margin:0 0 8px; font-size:11px; letter-spacing:0.14em; color:var(--text-dim); font-weight:700;
  }
  #leaderboard ol{ list-style:none; margin:0; padding:0; counter-reset:none; }
  #leaderboard li{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--text-main); padding:3px 0;
    white-space:nowrap; overflow:hidden;
  }
  #leaderboard li .rank{ width:16px; color:var(--text-dim); font-weight:700; flex:none; }
  #leaderboard li .dot{ width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 6px currentColor; }
  #leaderboard li .nm{ overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; }
  #leaderboard li .ln{ color:var(--text-dim); font-weight:600; flex:none; font-size:11px; }
  #leaderboard li.me{ color:var(--accent); font-weight:700; }
  #leaderboard li.me .ln{ color:var(--accent); }

  #instructions{
    position:absolute; bottom:16px; left:16px;
    padding:9px 14px;
    font-size:11.5px; color:var(--text-dim); line-height:1.5;
    max-width:230px;
  }
  #instructions b{ color:var(--text-main); }
  @media (max-width: 720px){
    #instructions{ display:none; }
  }
  body.joystick-active #instructions{ display:none; }
  @media (max-width: 480px){
    #statsPanel{ padding:8px 12px; min-width:0; top:10px; left:10px; }
    #statsPanel .row{ font-size:11px; gap:10px; margin-bottom:2px; }
    #statsPanel .val{ font-size:13px; }
    #leaderboard{ width:128px; padding:8px 10px 9px; top:10px; right:10px; }
    #leaderboard h3{ font-size:9.5px; margin-bottom:5px; }
    #leaderboard li{ font-size:11px; gap:5px; padding:2px 0; }
    #leaderboard li .rank{ width:12px; }
    #leaderboard li .ln{ font-size:9.5px; }
  }

  #boostBtn{
    position:absolute;
    right:max(22px, env(safe-area-inset-right));
    bottom:max(22px, env(safe-area-inset-bottom));
    width:92px; height:92px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(75,227,255,0.35), rgba(20,26,38,0.55));
    border:2px solid rgba(75,227,255,0.55);
    box-shadow:0 0 22px rgba(75,227,255,0.25), inset 0 0 18px rgba(75,227,255,0.15);
    display:flex; align-items:center; justify-content:center;
    color:#eafcff; font-size:12px; font-weight:800; letter-spacing:0.08em;
    pointer-events:auto; -webkit-user-select:none; user-select:none;
    transition:transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  #boostBtn::before{
    content:"";
    position:absolute; inset:-2px; border-radius:50%;
    border:2px solid transparent;
  }
  #boostBtn.active{
    transform:scale(0.92);
    background:radial-gradient(circle at 35% 30%, rgba(75,227,255,0.65), rgba(20,26,38,0.6));
    box-shadow:0 0 34px rgba(75,227,255,0.55), inset 0 0 22px rgba(75,227,255,0.3);
  }
  @media (min-width:900px){
    #boostBtn{ width:78px; height:78px; font-size:11px; }
  }

  #miniHint{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    padding:6px 14px; font-size:12px; color:var(--text-dim);
    opacity:0; transition:opacity 0.4s ease;
  }
  #miniHint.show{ opacity:1; }

  /* ---------- Game Over ---------- */
  #gameOverOverlay{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(10,12,20,0.55), rgba(3,4,8,0.92));
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.45s ease;
    z-index:20;
  }
  #gameOverOverlay.show{ opacity:1; pointer-events:auto; }
  #gameOverCard{
    width:min(380px, 88vw);
    padding:34px 30px 28px;
    text-align:center;
    background:linear-gradient(180deg, rgba(20,24,36,0.9), rgba(10,13,20,0.94));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,95,162,0.08);
    transform:translateY(10px) scale(0.98);
    transition:transform 0.45s ease;
  }
  #gameOverOverlay.show #gameOverCard{ transform:translateY(0) scale(1); }
  #gameOverCard h1{
    margin:0 0 6px; font-size:26px; letter-spacing:0.05em;
    background:linear-gradient(90deg, var(--accent2), #ff9a5f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:800;
  }
  #gameOverCard p.sub{ margin:0 0 22px; color:var(--text-dim); font-size:13px; }
  #gameOverStats{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:26px;
  }
  #gameOverStats .stat{
    background:rgba(255,255,255,0.04); border-radius:12px; padding:12px 6px;
    border:1px solid rgba(255,255,255,0.06);
  }
  #gameOverStats .stat .num{ font-size:20px; font-weight:800; color:var(--text-main); }
  #gameOverStats .stat .lbl{ font-size:10px; color:var(--text-dim); letter-spacing:0.08em; margin-top:3px; }
  #playAgainBtn{
    width:100%; padding:14px 0; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(90deg, var(--accent), #6df0c2);
    color:#04212a; font-size:15px; font-weight:800; letter-spacing:0.04em;
    box-shadow:0 8px 22px rgba(75,227,255,0.25);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  #playAgainBtn:active{ transform:scale(0.97); }

  #fpsTag{ position:absolute; bottom:6px; right:6px; font-size:10px; color:rgba(255,255,255,0.15); pointer-events:none; }

  /* ---------- Virtual joystick (touch) ---------- */
  #joystickBase{
    position:absolute;
    left:max(26px, env(safe-area-inset-left));
    bottom:max(26px, env(safe-area-inset-bottom));
    width:128px; height:128px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.07), rgba(14,18,28,0.45));
    border:2px solid rgba(255,255,255,0.16);
    box-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 0 16px rgba(255,255,255,0.04);
    pointer-events:auto;
    touch-action:none;
    display:none;
    z-index:5;
  }
  #joystickBase.visible{ display:block; }
  #joystickBase::after{
    content:"";
    position:absolute; inset:14px; border-radius:50%;
    border:1px dashed rgba(255,255,255,0.12);
  }
  #joystickKnob{
    position:absolute; top:50%; left:50%;
    width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(75,227,255,0.6), rgba(75,227,255,0.18));
    border:2px solid rgba(75,227,255,0.65);
    box-shadow:0 0 16px rgba(75,227,255,0.35), inset 0 0 10px rgba(255,255,255,0.15);
    transition:box-shadow 0.15s ease, background 0.15s ease;
    will-change:transform;
  }
  #joystickBase.dragging #joystickKnob{
    box-shadow:0 0 26px rgba(75,227,255,0.6), inset 0 0 12px rgba(255,255,255,0.2);
    background:radial-gradient(circle at 35% 30%, rgba(75,227,255,0.85), rgba(75,227,255,0.3));
  }
  @media (min-width:900px){
    #joystickBase{ width:110px; height:110px; }
    #joystickKnob{ width:46px; height:46px; margin:-23px 0 0 -23px; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="hud">
  <div id="statsPanel" class="panel">
    <div class="row"><span class="lbl">SCORE</span><span class="val" id="scoreVal">0</span></div>
    <div class="row"><span class="lbl">LENGTH</span><span class="val" id="lengthVal">0</span></div>
  </div>

  <div id="leaderboard" class="panel">
    <h3>LEADERBOARD</h3>
    <ol id="leaderboardList"></ol>
  </div>

  <div id="instructions" class="panel">
    <b>Mouse</b> to steer &middot; <b>Click / Space</b> to boost<br>
    <b>Joystick</b> to steer on touch &middot; use the <b>BOOST</b> button
  </div>

  <div id="miniHint" class="panel">Move the cursor to steer</div>

  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>

  <div id="boostBtn">BOOST</div>
</div>

<div id="gameOverOverlay">
  <div id="gameOverCard">
    <h1>YOU CRASHED</h1>
    <p class="sub">Your run has ended. Here's how you did:</p>
    <div id="gameOverStats">
      <div class="stat"><div class="num" id="finalScore">0</div><div class="lbl">SCORE</div></div>
      <div class="stat"><div class="num" id="finalLength">0</div><div class="lbl">LENGTH</div></div>
      <div class="stat"><div class="num" id="finalRank">#0</div><div class="lbl">BEST RANK</div></div>
    </div>
    <button id="playAgainBtn">PLAY AGAIN</button>
  </div>
</div>

<div id="fpsTag"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   1. GAME SETUP
   ========================================================================= */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha:false });

let DPR = Math.min(window.devicePixelRatio || 1, 2);
let VW = 0, VH = 0; // css pixel viewport size

function resizeCanvas(){
  VW = window.innerWidth;
  VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const WORLD = {
  radius: 3100,          // circular arena radius
  gridSize: 46,          // background grid cell size
};

const CONFIG = {
  pathStep: 4.2,                 // distance between recorded trail points
  baseSpeed: 132,                 // px/sec normal cruise speed
  boostSpeed: 248,                // px/sec while boosting
  accel: 9,                       // speed interpolation rate
  turnRateBase: 3.6,              // rad/sec turning speed at min length
  turnRateMin: 1.55,              // rad/sec turning speed at very large length
  startLength: 14,
  minBoostLength: 16,
  boostDropInterval: 0.11,
  boostLengthCostPerDrop: 0.55,
  boostFoodValue: 0.9,
  maxLength: 480,
  segSpacingFactor: 0.80,
  botCountMin: 9,
  botCountMax: 11,
  botRespawnDelayMin: 2.5,
  botRespawnDelayMax: 5.5,
  foodMax: 420,
  foodSpawnPerSec: 9,
  aiTickInterval: 0.11,           // how often bots recompute steering
};

let lastTime = performance.now();
let running = true;
let gameOver = false;
let deathPending = false;
let deathTimer = 0;

/* =========================================================================
   2. UTILITIES
   ========================================================================= */

function rand(min, max){ return Math.random() * (max - min) + min; }
function randInt(min, max){ return Math.floor(rand(min, max + 1)); }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function dist2(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; }
function dist(x1,y1,x2,y2){ return Math.sqrt(dist2(x1,y1,x2,y2)); }
function normalizeAngle(a){
  while(a > Math.PI) a -= Math.PI*2;
  while(a < -Math.PI) a += Math.PI*2;
  return a;
}
function angleDiff(target, current){ return normalizeAngle(target - current); }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function hslStr(h,s,l,a){ return `hsla(${h.toFixed(0)},${s}%,${l}%,${a===undefined?1:a})`; }

/* =========================================================================
   3. INPUT
   ========================================================================= */

const input = {
  pointerX: 0,       // screen-space pointer position
  pointerY: 0,
  hasPointer: false,
  boosting: false,
  usingTouch: false,
};

// Pointer starts centered on screen (straight ahead)
input.pointerX = window.innerWidth/2;
input.pointerY = window.innerHeight/2 - 40;

window.addEventListener('mousemove', (e) => {
  input.pointerX = e.clientX;
  input.pointerY = e.clientY;
  input.hasPointer = true;
  hideMiniHint();
});

window.addEventListener('mousedown', (e) => {
  if(e.button === 0){ input.boosting = true; }
});
window.addEventListener('mouseup', (e) => {
  if(e.button === 0){ input.boosting = false; }
});

window.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ input.boosting = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  if(e.code === 'Space'){ input.boosting = false; e.preventDefault(); }
});

function handleTouchMove(e){
  if(e.touches.length === 0) return;
  // Only steer from touches not on the boost button or the joystick
  for(const t of e.touches){
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if(el && (el.id === 'boostBtn' || el.closest('#joystickBase'))) continue;
    input.pointerX = t.clientX;
    input.pointerY = t.clientY;
    input.hasPointer = true;
    input.usingTouch = true;
    hideMiniHint();
    break;
  }
  e.preventDefault();
}
canvas.addEventListener('touchstart', handleTouchMove, { passive:false });
canvas.addEventListener('touchmove', handleTouchMove, { passive:false });

// --- Virtual joystick (primary touch steering control) ---
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const JOY_MAX_RADIUS = 40;   // px the knob visually travels
const JOY_DEADZONE = 6;      // px before steering input registers
let joystickTouchId = null;
const joystickCenter = { x: 0, y: 0 };

function isTouchCapable(){
  return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
}

function updateJoystickVisibility(){
  const show = isTouchCapable() && window.innerWidth <= 900;
  joystickBase.classList.toggle('visible', show);
  document.body.classList.toggle('joystick-active', show);
}
updateJoystickVisibility();
window.addEventListener('resize', updateJoystickVisibility);

function joystickMove(clientX, clientY){
  const dx = clientX - joystickCenter.x;
  const dy = clientY - joystickCenter.y;
  const dist = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  const visualDist = Math.min(dist, JOY_MAX_RADIUS);
  joystickKnob.style.transform =
    `translate(${(Math.cos(angle)*visualDist).toFixed(1)}px, ${(Math.sin(angle)*visualDist).toFixed(1)}px)`;
  if(dist > JOY_DEADZONE){
    input.pointerX = VW/2 + Math.cos(angle) * 300;
    input.pointerY = VH/2 + Math.sin(angle) * 300;
    input.hasPointer = true;
    input.usingTouch = true;
    hideMiniHint();
  }
}

function joystickReset(){
  joystickKnob.style.transform = 'translate(0px, 0px)';
  joystickBase.classList.remove('dragging');
  joystickTouchId = null;
}

joystickBase.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  const rect = joystickBase.getBoundingClientRect();
  joystickCenter.x = rect.left + rect.width/2;
  joystickCenter.y = rect.top + rect.height/2;
  joystickTouchId = t.identifier;
  joystickBase.classList.add('dragging');
  joystickMove(t.clientX, t.clientY);
  e.preventDefault();
  e.stopPropagation();
}, { passive:false });

joystickBase.addEventListener('touchmove', (e) => {
  for(const t of e.changedTouches){
    if(t.identifier === joystickTouchId){
      joystickMove(t.clientX, t.clientY);
      break;
    }
  }
  e.preventDefault();
  e.stopPropagation();
}, { passive:false });

function joystickEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier === joystickTouchId){
      joystickReset();
      break;
    }
  }
  e.preventDefault();
  e.stopPropagation();
}
joystickBase.addEventListener('touchend', joystickEnd, { passive:false });
joystickBase.addEventListener('touchcancel', joystickEnd, { passive:false });

const boostBtn = document.getElementById('boostBtn');
function setBoostActive(v){
  input.boosting = v;
  boostBtn.classList.toggle('active', v);
}
boostBtn.addEventListener('touchstart', (e) => { setBoostActive(true); e.preventDefault(); e.stopPropagation(); }, { passive:false });
boostBtn.addEventListener('touchend', (e) => { setBoostActive(false); e.preventDefault(); e.stopPropagation(); }, { passive:false });
boostBtn.addEventListener('touchcancel', (e) => { setBoostActive(false); }, { passive:false });
boostBtn.addEventListener('mousedown', (e) => { setBoostActive(true); e.preventDefault(); e.stopPropagation(); });
window.addEventListener('mouseup', () => { if(!input.usingTouch) boostBtn.classList.remove('active'); });

let miniHintShown = true;
function hideMiniHint(){
  if(miniHintShown){
    document.getElementById('miniHint').classList.remove('show');
    miniHintShown = false;
  }
}
setTimeout(() => { document.getElementById('miniHint').classList.add('show'); }, 200);

/* =========================================================================
   4. CAMERA
   ========================================================================= */

const camera = {
  x: 0, y: 0,
  zoom: 1,
  targetZoom: 1,
};

function updateCamera(dt){
  if(player && player.alive){
    camera.x = lerp(camera.x, player.x, clamp(dt*6,0,1));
    camera.y = lerp(camera.y, player.y, clamp(dt*6,0,1));
    camera.targetZoom = clamp(1.08 - (player.length / CONFIG.maxLength) * 0.42, 0.66, 1.08);
  }
  camera.zoom = lerp(camera.zoom, camera.targetZoom, clamp(dt*3,0,1));
}

function worldToScreen(x, y){
  return {
    x: (x - camera.x) * camera.zoom + VW/2,
    y: (y - camera.y) * camera.zoom + VH/2,
  };
}

/* =========================================================================
   5. PARTICLES
   ========================================================================= */

let particles = [];
const MAX_PARTICLES = 420;

function spawnParticles(x, y, count, color, opts){
  opts = opts || {};
  const speed = opts.speed || 90;
  const life = opts.life || 0.6;
  const size = opts.size || 3;
  for(let i=0;i<count;i++){
    if(particles.length >= MAX_PARTICLES) particles.shift();
    const a = rand(0, Math.PI*2);
    const s = rand(speed*0.25, speed);
    particles.push({
      x, y,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      life: rand(life*0.6, life*1.3),
      maxLife: life,
      size: rand(size*0.5, size*1.4),
      color,
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vx *= (1 - Math.min(dt*2.2,1));
    p.vy *= (1 - Math.min(dt*2.2,1));
  }
}

function renderParticles(){
  for(const p of particles){
    const s = worldToScreen(p.x, p.y);
    const t = p.life / p.maxLife;
    ctx.globalAlpha = clamp(t,0,1);
    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.arc(s.x, s.y, Math.max(0.4,p.size*t)*camera.zoom, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================================
   6. FOOD
   ========================================================================= */

let foods = [];

const FOOD_PALETTE = [
  '#5fe0ff', '#ff6fa5', '#ffd166', '#8effa1', '#c58fff', '#ff9d5c'
];

function makeFood(x, y, value, opts){
  opts = opts || {};
  return {
    x, y,
    value,
    radius: opts.radius || clamp(2.4 + value*1.1, 2.4, 11),
    color: opts.color || pickRandom(FOOD_PALETTE),
    glow: !!opts.glow,
    pulse: Math.random()*Math.PI*2,
  };
}

function spawnRandomFood(count){
  for(let i=0;i<count;i++){
    if(foods.length >= CONFIG.foodMax) return;
    const a = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random()) * (WORLD.radius - 60);
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    const big = Math.random() < 0.045;
    if(big){
      foods.push(makeFood(x, y, rand(7,13), { radius: rand(8,12), glow:true, color: pickRandom(FOOD_PALETTE) }));
    } else {
      foods.push(makeFood(x, y, rand(0.6,2.2)));
    }
  }
}

let foodSpawnAccum = 0;
function updateFoodSpawning(dt){
  foodSpawnAccum += dt * CONFIG.foodSpawnPerSec;
  while(foodSpawnAccum >= 1 && foods.length < CONFIG.foodMax){
    spawnRandomFood(1);
    foodSpawnAccum -= 1;
  }
}

function scatterFoodFromSnake(snake){
  const segs = snake.segments;
  const step = Math.max(1, Math.floor(segs.length/46));
  let dropped = 0;
  for(let i=0;i<segs.length && dropped<46;i+=step){
    const s = segs[i];
    const jitter = snake.radius*0.6;
    foods.push(makeFood(
      s.x + rand(-jitter,jitter),
      s.y + rand(-jitter,jitter),
      rand(1.2,2.6),
      { color: snake.foodColor }
    ));
    dropped++;
    if(foods.length > CONFIG.foodMax + 60) foods.shift();
  }
}

function renderFood(viewMinX,viewMinY,viewMaxX,viewMaxY, t){
  for(const f of foods){
    if(f.x < viewMinX || f.x > viewMaxX || f.y < viewMinY || f.y > viewMaxY) continue;
    const s = worldToScreen(f.x, f.y);
    const pulse = 1 + Math.sin(t*3 + f.pulse)*0.12;
    const r = f.radius * camera.zoom * (f.glow ? pulse : 1);
    if(f.glow){
      ctx.save();
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 18 * camera.zoom;
      ctx.beginPath();
      ctx.fillStyle = f.color;
      ctx.arc(s.x, s.y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.fillStyle = f.color;
      ctx.arc(s.x, s.y, r, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

/* =========================================================================
   7. SNAKE CLASS
   ========================================================================= */

let snakeIdCounter = 1;

class Snake {
  constructor(opts){
    this.id = snakeIdCounter++;
    this.isPlayer = !!opts.isPlayer;
    this.name = opts.name;
    this.personality = opts.personality || null;
    this.hue = opts.hue;
    this.color = hslStr(this.hue, 82, 58);
    this.colorDark = hslStr(this.hue, 70, 34);
    this.foodColor = hslStr(this.hue, 90, 65);

    this.x = opts.x;
    this.y = opts.y;
    this.angle = opts.angle !== undefined ? opts.angle : rand(0, Math.PI*2);
    this.desiredAngle = this.angle;
    this.speed = CONFIG.baseSpeed;
    this.boosting = false;

    this.length = opts.length || CONFIG.startLength;
    this.score = 0;
    this.alive = true;
    this.deathHandled = false;

    this.trail = [{x:this.x, y:this.y}];
    this.pathAccum = 0;
    this.segments = [];

    this.boostDropTimer = 0;

    // AI state
    this.aiTimer = Math.random()*CONFIG.aiTickInterval;
    this.wanderTarget = null;
    this.mistakeUntil = 0;
    this.mistakeAngleOffset = 0;
    this.aiBoostUntil = 0;

    this.updateRadius();
    this.updateSegments(true);
  }

  updateRadius(){
    this.radius = clamp(6 + Math.sqrt(this.length) * 1.15, 6, 34);
  }

  get maxTurnRate(){
    const t = clamp(this.length / CONFIG.maxLength, 0, 1);
    return lerp(CONFIG.turnRateBase, CONFIG.turnRateMin, t);
  }

  grow(amount){
    this.length = clamp(this.length + amount, 4, CONFIG.maxLength);
    this.updateRadius();
  }

  shrink(amount){
    this.length = clamp(this.length - amount, 6, CONFIG.maxLength);
    this.updateRadius();
  }

  update(dt){
    if(!this.alive) return;

    // Turn toward desired angle
    const diff = angleDiff(this.desiredAngle, this.angle);
    const maxTurn = this.maxTurnRate * dt;
    this.angle += clamp(diff, -maxTurn, maxTurn);

    // Speed
    const canBoost = this.boosting && this.length > CONFIG.minBoostLength;
    const targetSpeed = canBoost ? CONFIG.boostSpeed : CONFIG.baseSpeed;
    this.speed = lerp(this.speed, targetSpeed, clamp(dt*CONFIG.accel,0,1));

    const dx = Math.cos(this.angle) * this.speed * dt;
    const dy = Math.sin(this.angle) * this.speed * dt;
    const prevX = this.x, prevY = this.y;
    this.x += dx;
    this.y += dy;

    // Record path at fixed step intervals for smooth uniform body
    const moved = Math.hypot(this.x - prevX, this.y - prevY);
    this.pathAccum += moved;
    let guard = 0;
    while(this.pathAccum >= CONFIG.pathStep && guard < 8){
      const t = 1 - (this.pathAccum - CONFIG.pathStep) / Math.max(moved, 0.0001);
      const px = lerp(prevX, this.x, clamp(t,0,1));
      const py = lerp(prevY, this.y, clamp(t,0,1));
      this.trail.push({x:px, y:py});
      this.pathAccum -= CONFIG.pathStep;
      guard++;
    }

    // Boosting: drop food + shrink slightly
    if(canBoost){
      this.boostDropTimer += dt;
      if(this.boostDropTimer >= CONFIG.boostDropInterval){
        this.boostDropTimer -= CONFIG.boostDropInterval;
        const tail = this.segments.length ? this.segments[this.segments.length-1] : {x:this.x,y:this.y};
        if(foods.length < CONFIG.foodMax + 40){
          foods.push(makeFood(tail.x, tail.y, CONFIG.boostFoodValue, { color:this.foodColor }));
        }
        this.shrink(CONFIG.boostLengthCostPerDrop);
        if(this.length <= CONFIG.minBoostLength){
          this.boosting = false;
        }
      }
    } else {
      this.boostDropTimer = 0;
    }

    this.updateSegments(false);
    this.trimTrail();
  }

  updateSegments(force){
    const spacing = this.radius * CONFIG.segSpacingFactor;
    const numSegments = Math.max(4, Math.round(this.length));
    const trail = this.trail;
    const n = trail.length;
    if(n === 0) return;

    const segs = this.segments;
    segs.length = 0;

    for(let i=0;i<numSegments;i++){
      const distFromHead = i * spacing;
      const stepsBack = distFromHead / CONFIG.pathStep;
      let idx = (n - 1) - stepsBack;
      if(idx < 0) idx = 0;
      const i0 = Math.floor(idx);
      const i1 = Math.min(n-1, i0+1);
      const frac = idx - i0;
      const p0 = trail[i0];
      const p1 = trail[i1];
      segs.push({ x: lerp(p0.x, p1.x, frac), y: lerp(p0.y, p1.y, frac) });
    }
  }

  trimTrail(){
    const spacing = this.radius * CONFIG.segSpacingFactor;
    const neededLen = (this.length + 4) * spacing;
    const neededPoints = Math.ceil(neededLen / CONFIG.pathStep) + 8;
    if(this.trail.length > neededPoints + 40){
      this.trail.splice(0, this.trail.length - neededPoints);
    }
  }

  get headRadius(){ return this.radius; }
}

/* =========================================================================
   8. WORLD STATE / ENTITY MANAGEMENT
   ========================================================================= */

let player = null;
let bots = [];
let botRespawnQueue = []; // {timer}
let botTargetCount = CONFIG.botCountMin;

const NAME_POOL = [
  "Zigzag","Blaze","Nova","Fangtooth","Cinder","Shadowcoil","Turbo","Nimbus",
  "Vortex","Widow","Comet","Talon","Onyx","Static","Wrenlet","Frostbyte",
  "Ripple","Cyclone","Dagger","Marbles","Slick","Pixel","Bramble","Quartz",
  "Ashcoil","Nitro","Momentum","Orbit","Vapor","Scorch","Puddle","Glider",
  "Sable","Ember","Halo","Ricochet","Prism","Rustle","Tumble","Ferro"
];
let namePoolShuffled = [];
function nextBotName(){
  if(namePoolShuffled.length === 0){
    namePoolShuffled = [...NAME_POOL].sort(()=>Math.random()-0.5);
  }
  return namePoolShuffled.pop();
}

const PERSONALITIES = ['aggressive','hunter','coward','explorer','trapper'];

function randomSpawnPoint(minDistFromPlayer){
  let x,y,tries=0;
  do{
    const a = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random()) * (WORLD.radius*0.86);
    x = Math.cos(a)*r; y = Math.sin(a)*r;
    tries++;
  } while(player && minDistFromPlayer && dist(x,y,player.x,player.y) < minDistFromPlayer && tries < 12);
  return {x,y};
}

function createBot(){
  const pos = randomSpawnPoint(900);
  const personality = pickRandom(PERSONALITIES);
  const hue = randInt(0,359);
  const bot = new Snake({
    x: pos.x, y: pos.y,
    hue,
    name: nextBotName(),
    personality,
    length: rand(CONFIG.startLength, CONFIG.startLength + 40),
  });
  bots.push(bot);
  return bot;
}

function initWorld(){
  player = new Snake({
    x: 0, y: 0,
    hue: 191,
    name: 'You',
    isPlayer: true,
    length: CONFIG.startLength,
  });
  player.color = hslStr(191, 90, 62);
  player.colorDark = hslStr(191, 80, 38);
  player.foodColor = hslStr(191, 95, 68);

  bots = [];
  botRespawnQueue = [];
  botTargetCount = randInt(CONFIG.botCountMin, CONFIG.botCountMax);
  for(let i=0;i<botTargetCount;i++) createBot();

  foods = [];
  spawnRandomFood(340);
  // guarantee a well-fed starting area near spawn regardless of overall density
  for(let i=0;i<45;i++){
    const a = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random()) * 620;
    foods.push(makeFood(Math.cos(a)*r, Math.sin(a)*r, rand(0.6,2.2)));
  }

  particles = [];
  camera.x = 0; camera.y = 0; camera.zoom = 1; camera.targetZoom = 1;

  gameOver = false;
  deathPending = false;
  deathTimer = 0;
  bestRankAchieved = 999;

  document.getElementById('gameOverOverlay').classList.remove('show');
}

/* =========================================================================
   9. BOT AI
   ========================================================================= */

function allAliveSnakes(){
  const arr = [];
  if(player && player.alive) arr.push(player);
  for(const b of bots) if(b.alive) arr.push(b);
  return arr;
}

function updateBotAI(bot, dt, others){
  bot.aiTimer -= dt;
  if(bot.boosting && Math.random() < 0.02) bot.boosting = false;

  if(bot.aiTimer > 0) return;
  bot.aiTimer = CONFIG.aiTickInterval * rand(0.85, 1.2);

  const senseR = 620;
  const senseR2 = senseR*senseR;

  // --- find nearest good food ---
  let bestFood = null, bestFoodScore = -Infinity;
  for(const f of foods){
    const d2 = dist2(bot.x, bot.y, f.x, f.y);
    if(d2 > senseR2) continue;
    const score = (f.value*3 + (f.glow?6:0)) - Math.sqrt(d2)*0.02;
    if(score > bestFoodScore){ bestFoodScore = score; bestFood = f; }
  }

  // --- scan nearby snakes: threats + prey ---
  let nearestThreat = null, nearestThreatD2 = Infinity;
  let nearestPrey = null, nearestPreyD2 = Infinity;
  let dangerVX = 0, dangerVY = 0, dangerCount = 0;

  for(const other of others){
    if(other === bot || !other.alive) continue;
    const dHead2 = dist2(bot.x, bot.y, other.x, other.y);
    const biggerBy = other.length - bot.length;

    if(dHead2 < senseR2){
      if(biggerBy > bot.length*0.15){
        if(dHead2 < nearestThreatD2){ nearestThreatD2 = dHead2; nearestThreat = other; }
      } else if(biggerBy < -bot.length*0.1){
        if(dHead2 < nearestPreyD2){ nearestPreyD2 = dHead2; nearestPrey = other; }
      }
    }

    // body-avoidance: sample a handful of segments for nearby danger
    const segs = other.segments;
    const step = Math.max(1, Math.floor(segs.length/14));
    for(let i = other===bot?6:0; i<segs.length; i+=step){
      const s = segs[i];
      const d2 = dist2(bot.x, bot.y, s.x, s.y);
      const avoidR = 110 + other.radius*1.7;
      if(d2 < avoidR*avoidR){
        const w = 1 - Math.sqrt(d2)/avoidR;
        dangerVX += (bot.x - s.x) * w;
        dangerVY += (bot.y - s.y) * w;
        dangerCount++;
      }
    }
  }

  // --- boundary avoidance ---
  const distFromCenter = Math.hypot(bot.x, bot.y);
  let boundaryVX = 0, boundaryVY = 0;
  const marginStart = WORLD.radius - 480;
  if(distFromCenter > marginStart){
    const w = clamp((distFromCenter - marginStart) / 480, 0, 1);
    boundaryVX = -(bot.x/distFromCenter) * w * 3;
    boundaryVY = -(bot.y/distFromCenter) * w * 3;
  }

  // --- personality weights ---
  let wFood=1, wAvoid=1.2, wHunt=0, wWander=0.35;
  switch(bot.personality){
    case 'aggressive': wFood=0.7; wAvoid=0.65; wHunt=1.6; wWander=0.2; break;
    case 'hunter':      wFood=1.1; wAvoid=0.85; wHunt=1.3; wWander=0.25; break;
    case 'coward':       wFood=0.9; wAvoid=2.0; wHunt=0; wWander=0.5; break;
    case 'explorer':     wFood=0.6; wAvoid=1.0; wHunt=0.2; wWander=1.3; break;
    case 'trapper':      wFood=0.7; wAvoid=0.9; wHunt=1.4; wWander=0.3; break;
  }

  let vx = 0, vy = 0;

  // occasional mistakes: during a mistake window, danger sense is ignored entirely
  // (this is what actually lets bots clip each other sometimes, per spec)
  if(Math.random() < 0.045){
    bot.mistakeUntil = performance.now() + rand(350,1000);
    bot.mistakeAngleOffset = rand(-0.5,0.5);
  }
  const inMistake = performance.now() < bot.mistakeUntil;

  // food attraction
  if(bestFood){
    const d = Math.sqrt(dist2(bot.x,bot.y,bestFood.x,bestFood.y)) || 1;
    vx += (bestFood.x - bot.x)/d * wFood;
    vy += (bestFood.y - bot.y)/d * wFood;
  }

  // threat avoidance (steer away from bigger nearby snake's head trajectory)
  if(!inMistake && nearestThreat && nearestThreatD2 < senseR2){
    const d = Math.sqrt(nearestThreatD2) || 1;
    const urgency = clamp(1 - d/senseR, 0, 1) * wAvoid * 2.4;
    vx += (bot.x - nearestThreat.x)/d * urgency;
    vy += (bot.y - nearestThreat.y)/d * urgency;
  }
  if(!inMistake && dangerCount > 0){
    const mag = Math.hypot(dangerVX,dangerVY) || 1;
    vx += (dangerVX/mag) * wAvoid * 1.8;
    vy += (dangerVY/mag) * wAvoid * 1.8;
  }
  vx += boundaryVX; vy += boundaryVY;

  // hunting behaviors
  if(nearestPrey && wHunt > 0){
    const d = Math.sqrt(nearestPreyD2) || 1;
    if(bot.personality === 'trapper'){
      // circle around the prey: aim perpendicular to the line to prey, tightening slowly
      const toX = nearestPrey.x - bot.x, toY = nearestPrey.y - bot.y;
      const perpX = -toY/d, perpY = toX/d;
      const tighten = clamp(1 - d/380, 0.15, 0.85);
      vx += (toX/d)*wHunt*(1-tighten)*0.7 + perpX*wHunt*tighten;
      vy += (toY/d)*wHunt*(1-tighten)*0.7 + perpY*wHunt*tighten;
    } else if(bot.personality === 'aggressive'){
      // lead-pursuit: aim ahead of prey's travel direction to cut it off
      const leadT = clamp(d / 260, 0, 1);
      const targetX = nearestPrey.x + Math.cos(nearestPrey.angle)*80*leadT;
      const targetY = nearestPrey.y + Math.sin(nearestPrey.angle)*80*leadT;
      const dx = targetX-bot.x, dy = targetY-bot.y;
      const dd = Math.hypot(dx,dy) || 1;
      vx += (dx/dd)*wHunt;
      vy += (dy/dd)*wHunt;
      if(d < 340) bot.aiBoostUntil = performance.now() + 900;
    } else { // hunter
      vx += (nearestPrey.x-bot.x)/d*wHunt;
      vy += (nearestPrey.y-bot.y)/d*wHunt;
      if(d < 260) bot.aiBoostUntil = performance.now() + 500;
    }
  }

  // coward flees hard from threats
  if(bot.personality === 'coward' && nearestThreat && nearestThreatD2 < (420*420)){
    bot.aiBoostUntil = performance.now() + 400;
  }

  // wander
  if(!bot.wanderTarget || dist2(bot.x,bot.y,bot.wanderTarget.x,bot.wanderTarget.y) < 200*200 || Math.random()<0.003){
    bot.wanderTarget = randomSpawnPoint(0);
  }
  const wd = Math.sqrt(dist2(bot.x,bot.y,bot.wanderTarget.x,bot.wanderTarget.y)) || 1;
  vx += (bot.wanderTarget.x-bot.x)/wd * wWander;
  vy += (bot.wanderTarget.y-bot.y)/wd * wWander;

  let desired = Math.atan2(vy, vx);
  if(inMistake){
    desired += bot.mistakeAngleOffset;
  }
  bot.desiredAngle = desired;
  bot.boosting = performance.now() < bot.aiBoostUntil && bot.length > CONFIG.minBoostLength + 4;
}

function updateBotRespawns(dt){
  for(let i=botRespawnQueue.length-1;i>=0;i--){
    botRespawnQueue[i].timer -= dt;
    if(botRespawnQueue[i].timer <= 0){
      botRespawnQueue.splice(i,1);
      if(bots.filter(b=>b.alive).length < botTargetCount){
        createBot();
      }
    }
  }
  // prune fully-dead bot objects periodically to keep array small
  if(bots.length > botTargetCount * 2){
    bots = bots.filter(b => b.alive);
  }
}

/* =========================================================================
   10. COLLISION DETECTION
   ========================================================================= */

function handleDeath(snake){
  if(snake.deathHandled) return;
  snake.deathHandled = true;
  snake.alive = false;

  scatterFoodFromSnake(snake);
  spawnParticles(snake.x, snake.y, 34, snake.color, { speed:170, life:0.7, size:4 });

  if(snake.isPlayer){
    deathPending = true;
    deathTimer = 0.5;
  } else {
    botRespawnQueue.push({ timer: rand(CONFIG.botRespawnDelayMin, CONFIG.botRespawnDelayMax) });
  }
}

function runCollisions(){
  const alive = allAliveSnakes();
  const toKill = new Set();

  // head vs body (skip own head/near-head segments)
  for(const a of alive){
    if(toKill.has(a)) continue;
    // boundary check
    if(Math.hypot(a.x,a.y) > WORLD.radius - a.radius*0.5){
      toKill.add(a);
      continue;
    }
    for(const b of alive){
      if(a === b) continue;
      const segs = b.segments;
      const skip = 5; // ignore the first few segments (treated as "head zone", handled separately)
      const hitR = a.headRadius*0.78 + b.radius*0.72;
      const hitR2 = hitR*hitR;
      for(let i=skip;i<segs.length;i++){
        const s = segs[i];
        if(dist2(a.x,a.y,s.x,s.y) < hitR2){
          toKill.add(a);
          break;
        }
      }
      if(toKill.has(a)) break;
    }
  }

  // head vs head
  for(let i=0;i<alive.length;i++){
    for(let j=i+1;j<alive.length;j++){
      const a = alive[i], b = alive[j];
      if(toKill.has(a) && toKill.has(b)) continue;
      const r = a.headRadius*0.8 + b.headRadius*0.8;
      if(dist2(a.x,a.y,b.x,b.y) < r*r){
        if(a.length > b.length*1.08) toKill.add(b);
        else if(b.length > a.length*1.08) toKill.add(a);
        else { toKill.add(a); toKill.add(b); }
      }
    }
  }

  for(const s of toKill) handleDeath(s);
}

function handleEating(){
  const alive = allAliveSnakes();
  for(const s of alive){
    const r2 = (s.headRadius + 12) * (s.headRadius + 12);
    for(let i=foods.length-1;i>=0;i--){
      const f = foods[i];
      if(dist2(s.x,s.y,f.x,f.y) < (s.headRadius*0.9 + f.radius) * (s.headRadius*0.9 + f.radius)){
        foods.splice(i,1);
        s.grow(f.value);
        s.score += f.value * 12;
        spawnParticles(f.x, f.y, 5, f.color, { speed:60, life:0.35, size:2.4 });
      }
    }
  }
}

/* =========================================================================
   11. RENDERING
   ========================================================================= */

function drawBackground(t){
  ctx.fillStyle = '#05070c';
  ctx.fillRect(0,0,VW,VH);

  // subtle drifting grid
  const gs = WORLD.gridSize * camera.zoom;
  const driftX = (t*4) % gs;
  const driftY = (t*2.4) % gs;
  const offX = ((-camera.x*camera.zoom + VW/2) % gs) + driftX;
  const offY = ((-camera.y*camera.zoom + VH/2) % gs) + driftY;

  ctx.strokeStyle = 'rgba(90,140,190,0.055)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x = offX % gs; x < VW; x += gs){
    ctx.moveTo(x,0); ctx.lineTo(x,VH);
  }
  for(let y = offY % gs; y < VH; y += gs){
    ctx.moveTo(0,y); ctx.lineTo(VW,y);
  }
  ctx.stroke();

  // radial vignette glow near center of world for depth
  const centerScreen = worldToScreen(0,0);
  const grad = ctx.createRadialGradient(centerScreen.x, centerScreen.y, 0, centerScreen.x, centerScreen.y, WORLD.radius*camera.zoom*0.9);
  grad.addColorStop(0, 'rgba(40,60,90,0.10)');
  grad.addColorStop(1, 'rgba(5,7,12,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,VW,VH);
}

function drawBoundary(t){
  const c = worldToScreen(0,0);
  const r = WORLD.radius * camera.zoom;
  ctx.save();
  ctx.beginPath();
  ctx.arc(c.x, c.y, r, 0, Math.PI*2);
  ctx.lineWidth = 10;
  ctx.strokeStyle = `rgba(255,90,140,${0.35 + Math.sin(t*1.4)*0.06})`;
  ctx.shadowColor = 'rgba(255,90,140,0.65)';
  ctx.shadowBlur = 26;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.arc(c.x, c.y, r+2, 0, Math.PI*2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,180,200,0.5)';
  ctx.stroke();
  ctx.restore();
}

function drawSnake(s, t){
  if(!s.alive) return;
  const segs = s.segments;
  if(segs.length === 0) return;

  // cull entirely off-screen snakes
  const headS = worldToScreen(s.x, s.y);
  const margin = s.radius*camera.zoom*2 + 400;
  if(headS.x < -margin || headS.x > VW+margin || headS.y < -margin || headS.y > VH+margin){
    // still might have body on screen for very long snakes; do a cheap check on tail too
    const tail = segs[segs.length-1];
    const tailS = worldToScreen(tail.x, tail.y);
    if(tailS.x < -margin || tailS.x > VW+margin || tailS.y < -margin || tailS.y > VH+margin){
      return;
    }
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;

  // body, tail to head so head renders on top
  for(let i=segs.length-1;i>=0;i--){
    const seg = segs[i];
    const ss = worldToScreen(seg.x, seg.y);
    const rr = s.radius * camera.zoom * lerp(0.62, 1, 1 - i/segs.length);
    const shade = (i % 2 === 0) ? s.color : s.colorDark;
    ctx.beginPath();
    ctx.fillStyle = shade;
    ctx.arc(ss.x, ss.y, rr, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // boost glow trail
  if(s.boosting){
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 22;
    const hs = worldToScreen(s.x,s.y);
    ctx.beginPath();
    ctx.fillStyle = s.color;
    ctx.arc(hs.x, hs.y, s.radius*camera.zoom*1.1, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // eyes on head
  const headScreen = worldToScreen(s.x, s.y);
  const eyeOffset = s.radius * camera.zoom * 0.55;
  const eyeR = Math.max(1.4, s.radius*camera.zoom*0.22);
  for(const side of [-1,1]){
    const perp = s.angle + Math.PI/2*side;
    const ex = headScreen.x + Math.cos(s.angle)*eyeOffset*0.7 + Math.cos(perp)*eyeOffset*0.65;
    const ey = headScreen.y + Math.sin(s.angle)*eyeOffset*0.7 + Math.sin(perp)*eyeOffset*0.65;
    ctx.beginPath();
    ctx.fillStyle = '#0b1420';
    ctx.arc(ex, ey, eyeR, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(ex + Math.cos(s.angle)*eyeR*0.4, ey + Math.sin(s.angle)*eyeR*0.4, eyeR*0.4, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // name tag for bots (skip when too small on screen or too far)
  if(!s.isPlayer && s.radius*camera.zoom > 5){
    ctx.save();
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(s.name, headScreen.x, headScreen.y - s.radius*camera.zoom - 10);
    ctx.restore();
  }
}

function render(t){
  drawBackground(t);

  const halfW = (VW/2)/camera.zoom, halfH = (VH/2)/camera.zoom;
  const viewMinX = camera.x - halfW - 60, viewMaxX = camera.x + halfW + 60;
  const viewMinY = camera.y - halfH - 60, viewMaxY = camera.y + halfH + 60;

  drawBoundary(t);
  renderFood(viewMinX,viewMinY,viewMaxX,viewMaxY, t);

  for(const b of bots) drawSnake(b, t);
  if(player) drawSnake(player, t);

  renderParticles();
}

/* =========================================================================
   12. UI
   ========================================================================= */

const scoreValEl = document.getElementById('scoreVal');
const lengthValEl = document.getElementById('lengthVal');
const leaderboardListEl = document.getElementById('leaderboardList');
const gameOverOverlayEl = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const finalLengthEl = document.getElementById('finalLength');
const finalRankEl = document.getElementById('finalRank');
const playAgainBtn = document.getElementById('playAgainBtn');

let bestRankAchieved = 999;
let uiAccum = 0;

function updateUI(dt){
  uiAccum += dt;
  if(uiAccum < 0.1) return;
  uiAccum = 0;

  if(player){
    scoreValEl.textContent = Math.floor(player.score);
    lengthValEl.textContent = Math.round(player.length);
  }

  const ranking = [];
  if(player && player.alive) ranking.push(player);
  for(const b of bots) if(b.alive) ranking.push(b);
  ranking.sort((a,b) => b.length - a.length);

  if(player){
    const idx = ranking.indexOf(player);
    if(idx >= 0) bestRankAchieved = Math.min(bestRankAchieved, idx+1);
  }

  leaderboardListEl.innerHTML = '';
  const top = ranking.slice(0,5);
  for(let i=0;i<top.length;i++){
    const s = top[i];
    const li = document.createElement('li');
    if(s.isPlayer) li.classList.add('me');
    li.innerHTML = `<span class="rank">${i+1}</span><span class="dot" style="color:${s.color}"></span><span class="nm">${s.isPlayer ? 'You' : s.name}</span><span class="ln">${Math.round(s.length)}</span>`;
    leaderboardListEl.appendChild(li);
  }
}

function showGameOver(){
  gameOver = true;
  finalScoreEl.textContent = Math.floor(player.score);
  finalLengthEl.textContent = Math.round(player.length);
  finalRankEl.textContent = '#' + (bestRankAchieved <= 20 ? bestRankAchieved : '20+');
  gameOverOverlayEl.classList.add('show');
}

playAgainBtn.addEventListener('click', () => {
  restartGame();
});

function restartGame(){
  initWorld();
}

/* =========================================================================
   13. GAME LOOP
   ========================================================================= */

let fpsSmoothed = 60;
const fpsTag = document.getElementById('fpsTag');
let fpsAccum = 0;

function updatePlayerInput(){
  if(!player || !player.alive) return;
  const dx = input.pointerX - VW/2;
  const dy = input.pointerY - VH/2;
  if(Math.hypot(dx,dy) > 4){
    player.desiredAngle = Math.atan2(dy,dx);
  }
  player.boosting = input.boosting;
}

function tick(now){
  requestAnimationFrame(tick);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = clamp(dt, 0, 0.05); // avoid huge steps after tab-away

  const t = now/1000;

  fpsAccum += dt;
  fpsSmoothed = lerp(fpsSmoothed, dt>0 ? 1/dt : fpsSmoothed, 0.05);
  if(fpsAccum > 0.5){ fpsAccum = 0; fpsTag.textContent = Math.round(fpsSmoothed)+' fps'; }

  if(!gameOver){
    updatePlayerInput();

    const aliveSnakes = allAliveSnakes();
    for(const b of bots){
      if(b.alive) updateBotAI(b, dt, aliveSnakes);
    }

    if(player && player.alive) player.update(dt);
    for(const b of bots) if(b.alive) b.update(dt);

    handleEating();
    runCollisions();
    updateFoodSpawning(dt);
    updateBotRespawns(dt);
    updateParticles(dt);
    updateCamera(dt);
    updateUI(dt);

    if(deathPending){
      deathTimer -= dt;
      if(deathTimer <= 0){
        deathPending = false;
        showGameOver();
      }
    }
  } else {
    // keep particles/camera alive briefly behind game-over screen
    updateParticles(dt);
  }

  render(t);
}

/* =========================================================================
   BOOT
   ========================================================================= */

initWorld();
requestAnimationFrame(tick);

})();
</script>
