html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"Underlight\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"theme-color\" content=\"#0b0e16\"><style>#ul-rotate{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#0b0e16;color:#e6edf6;font:16px/1.65 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}#ul-rotate b{display:block;font-size:20px;margin-bottom:10px;color:#54e6ff;letter-spacing:.04em}#ul-rotate span{display:block;margin-top:14px;font-size:13px;color:#8b95a4}#ul-rotate i{display:block;font-size:40px;margin-bottom:14px;font-style:normal;animation:ul-tip 1.8s ease-in-out infinite}@keyframes ul-tip{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-90deg)}}@media(orientation:portrait){#ul-rotate{display:flex}}</style><script>window.addEventListener('DOMContentLoaded',function(){var v=document.querySelector('meta[name=viewport]');if(v){v.setAttribute('content','width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover');}var d=document.createElement('div');d.id='ul-rotate';d.innerHTML='<div><i>&#9633;</i><b>TURN YOUR PHONE SIDEWAYS</b>Underlight is played in landscape.<span>Not rotating? Swipe down from the top-right corner and switch off Rotation Lock.</span></div>';document.body.appendChild(d);});function ulLock(){try{if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}catch(e){}}window.addEventListener('load',function(){ulLock();window.addEventListener('touchend',ulLock,{once:true});if('serviceWorker' in navigator){navigator.serviceWorker.register('index.service.worker.js').catch(function(){});}});</script>"
